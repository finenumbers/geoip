name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: geoip
          POSTGRES_PASSWORD: geoip
          POSTGRES_DB: geoip
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U geoip -d geoip"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://geoip:geoip@localhost:5432/geoip
      DATABASE_DIRECT_URL: postgresql://geoip:geoip@localhost:5432/geoip
      CONFIG_DATA_DIR: /tmp/geoip-ci-config
      RUN_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @geoip/shared build

      - name: Migrate and seed fixture dataset
        run: |
          pnpm db:migrate
          pnpm --filter @geoip/api seed:fixture

      - name: Lint
        run: pnpm lint

      - name: Dead code check (knip)
        run: pnpm knip

      - name: Public release hygiene
        run: ./scripts/check-public-ready.sh

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Docker build smoke
        run: docker compose -f docker-compose.yml -f docker-compose.build.yml build api web

      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}-chromium

      - name: Install Playwright Chromium browser
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: pnpm exec playwright install chromium

      - name: Install Playwright OS deps
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # Azure Ubuntu mirrors often hang on GHA; force archive.ubuntu.com.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf 'http://archive.ubuntu.com/ubuntu/\n' | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          sudo sed -i \
            -e 's|http://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            -e 's|https://azure.archive.ubuntu.com/ubuntu|http://archive.ubuntu.com/ubuntu|g' \
            /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          pnpm exec playwright install-deps chromium

      - name: E2E smoke
        timeout-minutes: 10
        run: pnpm e2e
